name: NEXO - Preparar novo Supabase (manual)

# Rotina excepcional. Nunca roda em push/PR/deploy; diagnóstico não altera o banco.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: "Diagnosticar sem alterações ou preparar após autorização do proprietário"
        required: true
        default: diagnosticar
        type: choice
        options:
          - diagnosticar
          - preparar
      confirmacao:
        description: "Somente para preparar: digite PREPARAR_NEXO após autorizar as migrações e o seed"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nexo-supabase-bootstrap
  cancel-in-progress: false

jobs:
  preparar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLASK_ENV: production
      PYTHON_DOTENV_DISABLED: "1"
      NEXO_PUBLIC_URL: https://nexo-faturamento-inteligente-render.onrender.com
      DATABASE_URL: ${{ secrets.NEXO_BOOTSTRAP_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.NEXO_BOOTSTRAP_DIRECT_URL }}
      ADMIN_EMAIL: ${{ secrets.NEXO_BOOTSTRAP_ADMIN_EMAIL }}
      ADMIN_SENHA: ${{ secrets.NEXO_BOOTSTRAP_ADMIN_SENHA }}
      ADMIN_NOME: Administrador NEXO

    steps:
      - name: Validar ação manual e Secrets necessários sem exibir valores
        shell: bash
        env:
          ACAO: ${{ inputs.acao }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [[ "$ACAO" != "diagnosticar" && "$ACAO" != "preparar" ]]; then
            echo "::error::Ação inválida. Selecione diagnosticar ou preparar."
            exit 1
          fi
          for key in DATABASE_URL DIRECT_URL; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Secret de conexão ausente para $key."
              exit 1
            fi
          done
          if [[ "$ACAO" == "preparar" ]]; then
            if [[ "$CONFIRMACAO" != "PREPARAR_NEXO" ]]; then
              echo "::error::Preparação exige confirmação explícita PREPARAR_NEXO."
              exit 1
            fi
            for key in ADMIN_EMAIL ADMIN_SENHA; do
              if [[ -z "${!key}" ]]; then
                echo "::error::Secret de instalação ausente para $key."
                exit 1
              fi
            done
          fi

      - name: Obter código aprovado da branch main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências oficiais com o instalador verificado do projeto
        run: python -I tools/install_dependencies.py --requirements requirements.txt

      - name: Gerar e mascarar chave efêmera de sessão para esta execução
        run: |
          python - <<'PY'
          import os
          import secrets
          key = secrets.token_hex(32)
          print(f"::add-mask::{key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write(f"SECRET_KEY={key}\n")
          PY

      - name: Confirmar projeto, portas, TLS e estado inicial (somente leitura)
        run: python -m scripts.bootstrap_supabase diagnosticar

      - name: Aplicar exclusivamente as migrações oficiais (flask db upgrade)
        if: inputs.acao == 'preparar'
        env:
          NEXO_BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmacao }}
        run: python -m scripts.bootstrap_supabase migrar

      - name: Executar seed.py oficial após validar o head
        if: inputs.acao == 'preparar'
        env:
          NEXO_BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmacao }}
        run: python -m scripts.bootstrap_supabase seed

      - name: Validar tabelas, head, planos e ADMIN ativo com senha esperada (somente leitura)
        if: inputs.acao == 'preparar'
        run: python -m scripts.bootstrap_supabase verificar
