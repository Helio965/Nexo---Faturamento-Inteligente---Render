name: NEXO Security CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  FLASK_ENV: development
  SECRET_KEY: synthetic-ci-only-not-production
  DATABASE_URL: "sqlite:///:memory:"
  DIRECT_URL: ""
  NEXO_DB_DIRECT: "0"
  BREVO_API_KEY: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  ANTHROPIC_API_KEY: ""
  HF_API_TOKEN: ""

jobs:
  sqlite-browser:
    name: security-sqlite-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Ferramentas de PDF e PostgreSQL descartavel
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils postgresql postgresql-client
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_dump"
          echo "NEXO_TEST_POSTGRES_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Instalador verificado e dependencias de teste
        run: python -I tools/install_dependencies.py --requirements requirements-dev.txt
      - name: Navegador de teste com suporte ao MP4 H.264 e AAC
        run: |
          python -m playwright install-deps chromium
          chrome_bin="$(command -v google-chrome)"
          test -x "$chrome_bin"
          echo "NEXO_TEST_CHROMIUM=$chrome_bin" >> "$GITHUB_ENV"
          "$chrome_bin" --version
      - name: Suite completa, navegador e ensaio de backup
        env:
          NEXO_TEST_BROWSER: "1"
        run: |
          test_status=0
          python -B -m unittest discover -s tests -t . -v > "$RUNNER_TEMP/nexo-tests.log" 2>&1 || test_status=$?
          cat "$RUNNER_TEMP/nexo-tests.log"
          if [ "$test_status" -ne 0 ]; then
            python - <<'PY'
          import os
          import re
          from pathlib import Path
          log = (Path(os.environ["RUNNER_TEMP"]) / "nexo-tests.log").read_text(errors="replace")
          blocks = re.findall(r"^(?:FAIL|ERROR): .*?(?=^={10,}\s*$|^-{10,}\nRan |\Z)", log, re.M | re.S)
          for block in blocks[:10]:
              message = block[:6000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Falha unittest::" + message)
          if not blocks:
              print("::error title=Falha unittest::A suíte terminou com erro; consultar o log do job.")
          PY
          fi
          exit "$test_status"

  postgresql-security:
    name: security-postgresql
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Binarios para o servico PostgreSQL isolado
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql postgresql-client
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          echo "NEXO_TEST_POSTGRES_BIN=$pg_bin" >> "$GITHUB_ENV"
          "$pg_bin/postgres" --version
      - name: Instalador verificado e dependencias de teste
        run: python -I tools/install_dependencies.py --requirements requirements-dev.txt
      - name: Tokens e concorrencia no PostgreSQL real
        run: python -B -m unittest tests.postgresql_auth_tokens -v
      - name: Sessoes e corridas de notificacao no PostgreSQL real
        run: python -B -m unittest tests.postgresql_session_revocation -v
      - name: Restauracao de empresas e concorrencia no PostgreSQL real
        run: python -B -m unittest tests.postgresql_company_restore_security -v
      - name: Migracao SEC-004 com dados anteriores no PostgreSQL real
        run: python -B -m unittest tests.postgresql_company_restore_migration -v
      - name: ETL, limites, atomicidade e uploads concorrentes no PostgreSQL real
        run: python -B -m unittest tests.postgresql_etl_resource_security -v
